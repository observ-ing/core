# Why jobs are set up the way they are: docs/ci.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  # Node.js jobs
  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --json | node scripts/audit-check.mjs

  ts-bindings-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Check generated TypeScript bindings
        run: |
          cargo test -p observing-appview -- export_bindings
          npx oxfmt frontend/src/bindings
          git diff --exit-code frontend/src/bindings/

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run fmt:check

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  ts-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --project tsconfig.json
      - run: npx tsc --project frontend/tests/tsconfig.json

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-integration
          path: playwright-report/
          retention-days: 7

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://observ.ing
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  storybook-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm run check:stories

  storybook-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:storybook

  storybook-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 1

  storybook-deploy:
    runs-on: ubuntu-latest
    needs: [storybook-build]
    if: github.event_name == 'push'
    env:
      REGISTRY: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/storybook
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/

      - uses: docker/setup-buildx-action@v3

      - uses: google-github-actions/auth@v2
        id: gcp-auth
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.storybook
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/storybook:${{ github.sha }},${{ env.REGISTRY }}/storybook:latest
          cache-from: type=gha,scope=storybook
          cache-to: type=gha,mode=max,scope=storybook

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy storybook \
            --image=$REGISTRY/storybook:${{ github.sha }} \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=128Mi \
            --cpu=1 \
            --max-instances=3 \
            --min-instances=0

  # Rust jobs
  rust-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --locked

  rust-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  rust-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  rust-sqlx:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: observing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/observing
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: sqlx-cli@0.9.0 # bump with rust-toolchain.toml; see docs/ci.md
          no-default-features: true
          features: postgres
      - name: Run database migrations
        run: sqlx migrate run --source crates/observing-db/migrations
      - run: cargo sqlx prepare --workspace --check

  rust-db-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p observing-db --test '*'

  rust-lexicons-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Install jacquard-lexgen
        run: RUSTFLAGS="" cargo install jacquard-lexgen --version 0.12.1 --locked
      - name: Check generated lexicon types are up to date
        run: |
          ./scripts/generate-rust-types.sh
          cargo fmt -p observing-lexicons
          cargo check -p observing-lexicons
          git diff --exit-code crates/observing-lexicons/src/

  lexicons-lint:
    runs-on: ubuntu-latest
    env:
      GOAT_VERSION: '0.2.7'
      GOAT_SHA256: '691edc92ea497e675b8d2c7c7272e9e938abf02c32d800d091adade07983896d'
    steps:
      - uses: actions/checkout@v4
      - name: Install goat
        run: |
          curl -fsSL -o goat.tar.gz "https://github.com/bluesky-social/goat/releases/download/v${GOAT_VERSION}/goat_Linux_x86_64.tar.gz"
          echo "${GOAT_SHA256}  goat.tar.gz" | sha256sum -c -
          tar -xzf goat.tar.gz -C "$RUNNER_TEMP" goat
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Warnings fail the job too (goat exits non-zero on any lint).
      - name: Lint lexicon schemas
        run: goat lex lint lexicons/

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # State-machine simulation of the ingester against a real Postgres: random
  # repo writes + adversarial Tap delivery, checked against a reference model
  # (crates/tap-ingester/src/sim, docs/system-tests.md). Fixed seeds, so it's
  # deterministic; known bugs are ratcheted via KNOWN_VIOLATIONS.
  rust-sim:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SIM_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tap-ingester sim -- --nocapture

  # End-to-end tests
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: observing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/observing
      INDIGO_REV: ce62b8fce9e01434213a69cb251852b2c9436cb9
      TAP_GO_VERSION: '1.26'
      GOAT_VERSION: '0.2.7'
      GOAT_SHA256: '691edc92ea497e675b8d2c7c7272e9e938abf02c32d800d091adade07983896d'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '26'
          cache: 'npm'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build appview, tap-ingester, migrate
        run: cargo build -p observing-appview -p tap-ingester -p observing-migrate
      - name: Cache upstream `tap` binary
        id: tap-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/tap-bin
          key: tap-${{ runner.os }}-go${{ env.TAP_GO_VERSION }}-${{ env.INDIGO_REV }}
      - uses: actions/setup-go@v5
        if: steps.tap-cache.outputs.cache-hit != 'true'
        with:
          go-version: ${{ env.TAP_GO_VERSION }}
          cache: false
      - name: Build upstream `tap`
        if: steps.tap-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/indigo && cd /tmp/indigo
          git init . >/dev/null
          git remote add origin https://github.com/bluesky-social/indigo.git
          git fetch --depth 1 origin "$INDIGO_REV"
          git checkout FETCH_HEAD
          GODEBUG=netdns=go go build -tags timetzdata -o ~/.cache/tap-bin/tap ./cmd/tap
      - name: Add `tap` to PATH
        run: echo "$HOME/.cache/tap-bin" >> "$GITHUB_PATH"
      - name: Install process-compose
        env:
          PC_VERSION: v1.116.0
        run: |
          curl -fsSL "https://github.com/F1bonacc1/process-compose/releases/download/${PC_VERSION}/process-compose_linux_amd64.tar.gz" \
            | tar -xz -C /tmp process-compose
          sudo install /tmp/process-compose /usr/local/bin/process-compose
          process-compose version
      - name: Install goat
        run: |
          curl -fsSL -o goat.tar.gz "https://github.com/bluesky-social/goat/releases/download/v${GOAT_VERSION}/goat_Linux_x86_64.tar.gz"
          echo "${GOAT_SHA256}  goat.tar.gz" | sha256sum -c -
          tar -xzf goat.tar.gz -C "$RUNNER_TEMP" goat
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Cache @atproto/dev-env install
        uses: actions/cache@v4
        with:
          path: frontend/tests/dev-env/deps/node_modules
          key: devenv-deps-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('frontend/tests/dev-env/deps/package-lock.json') }}
      - name: Run isolated dev-env e2e tests
        run: npm run test:e2e:devenv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-images:
    runs-on: ubuntu-latest
    needs: [frontend-audit, fmt, frontend-lint, ts-bindings-check, ts-typecheck, frontend-build, rust-lockfile, rust-fmt, rust-deny, rust-clippy, rust-sqlx, rust-lexicons-check, lexicons-lint, rust-test, integration, e2e]
    if: github.event_name == 'push'
    env:
      REGISTRY: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/observing
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/dotnet
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: google-github-actions/auth@v2
        id: gcp-auth
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Build and push images
        env:
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
        run: docker buildx bake --file infra/docker/docker-bake.hcl --push

  deploy:
    runs-on: ubuntu-latest
    needs: [build-images]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy-appview.outputs.url }}
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGISTRY: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/observing
      REGION: us-central1
      PUBLIC_URL: https://observ.ing
      INGESTER_URL: https://ingester.observ.ing
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy species-id
        run: |
          gcloud run deploy observing-species-id \
            --image=$REGISTRY/observing-species-id:latest \
            --region=$REGION \
            --allow-unauthenticated \
            --cpu=2 \
            --memory=8Gi \
            --cpu-boost \
            --min-instances=0 \
            --execution-environment=gen2 \
            --startup-probe=tcpSocket.port=8080,periodSeconds=2,failureThreshold=150,timeoutSeconds=2 \
            --set-env-vars=RUST_LOG=observing_species_id=info,LOG_FORMAT=json

      - name: Deploy species-id-live
        run: |
          gcloud run deploy observing-species-id-live \
            --image=$REGISTRY/observing-species-id-live:latest \
            --region=$REGION \
            --allow-unauthenticated \
            --cpu=2 \
            --memory=4Gi \
            --cpu-boost \
            --min-instances=0 \
            --execution-environment=gen2 \
            --startup-probe=tcpSocket.port=8080,periodSeconds=2,failureThreshold=150,timeoutSeconds=2 \
            --set-env-vars=RUST_LOG=observing_species_id=info,LOG_FORMAT=json

      - name: Get service URLs
        id: urls
        run: |
          echo "species_id=$(gcloud run services describe observing-species-id --region=$REGION --format='value(status.url)')" >> $GITHUB_OUTPUT
          echo "species_id_live=$(gcloud run services describe observing-species-id-live --region=$REGION --format='value(status.url)')" >> $GITHUB_OUTPUT

      - name: Run migrations
        run: |
          gcloud run jobs deploy observing-migrate \
            --image=$REGISTRY/observing-migrate:latest \
            --region=$REGION \
            --set-cloudsql-instances=$PROJECT_ID:$REGION:observing-db \
            --set-secrets=DATABASE_URL=observing-db-admin-url:latest \
            --max-retries=0 \
            --task-timeout=600
          gcloud run jobs execute observing-migrate \
            --region=$REGION \
            --wait

      - name: Deploy task-runner
        run: |
          gcloud run jobs deploy observing-task-runner \
            --image=$REGISTRY/observing-task-runner:latest \
            --region=$REGION \
            --set-cloudsql-instances=$PROJECT_ID:$REGION:observing-db \
            --set-env-vars=RUST_LOG=observing_task_runner=info,DB_HOST=/cloudsql/$PROJECT_ID:$REGION:observing-db,DB_NAME=observing,DB_USER=ingester_runtime \
            --set-secrets=DB_PASSWORD=observing-db-ingester-password:latest \
            --max-retries=0 \
            --task-timeout=3600

      - name: Deploy worker
        run: |
          gcloud run deploy observing-worker \
            --image=$REGISTRY/observing-appview:latest \
            --region=$REGION \
            --no-allow-unauthenticated \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=4 \
            --timeout=900 \
            --add-cloudsql-instances=$PROJECT_ID:$REGION:observing-db \
            --set-env-vars="^|^DB_HOST=/cloudsql/$PROJECT_ID:$REGION:observing-db|DB_NAME=observing|DB_USER=appview_runtime|INGESTER_DB_USER=ingester_runtime|PUBLIC_URL=$PUBLIC_URL|APPVIEW_TASK_ROUTES=1" \
            --set-secrets=DB_PASSWORD=observing-db-appview-password:latest,INGESTER_DB_PASSWORD=observing-db-ingester-password:latest,INAT_CLIENT_ID=INAT_CLIENT_ID:latest,INAT_CLIENT_SECRET=INAT_CLIENT_SECRET:latest

      - name: Deploy tap-ingester
        run: |
          gcloud run deploy tap-ingester \
            --image=$REGISTRY/tap-ingester:latest \
            --region=$REGION \
            --allow-unauthenticated \
            --cpu=1 \
            --no-cpu-throttling \
            --memory=512Mi \
            --add-cloudsql-instances=$PROJECT_ID:$REGION:observing-db \
            --set-env-vars=RUST_LOG=tap_ingester=info,DB_HOST=/cloudsql/$PROJECT_ID:$REGION:observing-db,DB_NAME=observing,DB_USER=ingester_runtime,TAP_MAX_DB_CONNS=10,TAP_INHERIT_STDIO=1 \
            --set-secrets=DB_PASSWORD=observing-db-ingester-password:latest \
            --min-instances=1 \
            --max-instances=1 \
            --timeout=3600

      - name: Deploy appview
        id: deploy-appview
        run: |
          URL=$(gcloud run deploy observing-appview \
            --image=$REGISTRY/observing-appview:latest \
            --region=$REGION \
            --allow-unauthenticated \
            --add-cloudsql-instances=$PROJECT_ID:$REGION:observing-db \
            --set-env-vars="^|^DB_HOST=/cloudsql/$PROJECT_ID:$REGION:observing-db|DB_NAME=observing|DB_USER=appview_runtime|PUBLIC_URL=$PUBLIC_URL|SPECIES_ID_SERVICE_URL=${{ steps.urls.outputs.species_id }}|SPECIES_ID_LIVE_SERVICE_URL=${{ steps.urls.outputs.species_id_live }}|INGESTER_URL=$INGESTER_URL|GCP_PROJECT_ID=$PROJECT_ID|HIDDEN_DIDS=did:plc:jh6n3ntljfhhtr4jbvrm3k5b|ADMIN_DIDS=did:plc:vozr2os4b4sxrxr6opde5js5|CORS_ORIGINS=https://observ.ing,https://localhost,capacitor://localhost" \
            --set-secrets=DB_PASSWORD=observing-db-appview-password:latest,INAT_CLIENT_ID=INAT_CLIENT_ID:latest,INAT_CLIENT_SECRET=INAT_CLIENT_SECRET:latest \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
