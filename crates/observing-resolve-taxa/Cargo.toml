[package]
name = "observing-resolve-taxa"
version = "0.1.0"
edition = "2021"
description = "Fills accepted_taxon_key on identifications, as a one-shot run or a Cloud Tasks target"
license = "MIT OR Apache-2.0"

[dependencies]
observing-bootstrap = { path = "../observing-bootstrap", features = ["db"] }
observing-db = { path = "../observing-db", features = ["processing"] }
observing-taxonomy-gbif = { path = "../observing-taxonomy-gbif" }
wikidata-client = { path = "../wikidata-client" }
gcp-cloud-tasks = { path = "../gcp-cloud-tasks" }

tokio = { workspace = true }
sqlx = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-stackdriver = { workspace = true }

[[bin]]
name = "observing-resolve-taxa"
path = "src/main.rs"
