[package]
name = "observing-appview"
version = "0.1.0"
edition = "2021"
description = "Unified REST API and web server for Observ.ing"
license = "MIT OR Apache-2.0"

[dependencies]
# Internal crates
observing-bootstrap = { path = "../observing-bootstrap", features = ["db"] }
axum-admin = { path = "../axum-admin" }
observing-db = { path = "../observing-db", features = ["processing"] }
atproto-identity = { path = "../atproto-identity" }
observing-lexicons = { path = "../observing-lexicons" }
# Taxonomy resolver (formerly observing-taxonomy)
gbif = "0.1"
wikidata-client = { path = "../wikidata-client" }
# Media cache (formerly observing-media-proxy)
atproto-blob-resolver = { path = "../atproto-blob-resolver" }
file-blob-cache = { path = "../file-blob-cache" }
# Wire types for the species-id HTTP client
observing-species-id-protocol = { path = "../observing-species-id-protocol" }
# Postgres connection URL from env (DATABASE_URL or DB_* / Cloud SQL socket)
pg-url-env = { path = "../pg-url-env" }

# AT Protocol types (for record construction)
jacquard-common = "0.12"

# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true, features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower-http = { workspace = true, features = ["cors", "compression-full", "fs"] }

# Database
sqlx = { workspace = true }

# HTTP client (for internal agent RPC + GBIF / Wikidata lookups)
reqwest = { workspace = true, features = ["stream"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# TypeScript type generation
ts-rs = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Time
chrono = { workspace = true }

# Base64 for blob uploads
base64 = "0.22"

# AT Protocol OAuth + Agent
atrium-api = "0.25"
atrium-common = "0.1"
atrium-identity = "0.1"
atrium-oauth = "0.1"
hickory-resolver = "0.26"

# iNaturalist cross-posting (#878). Git dependencies until the changes in
# https://tangled.org/rwell.org/rust-inaturalist/pulls/6 are released.
inaturalist = { git = "https://tangled.org/kueda.net/rust-inaturalist", rev = "c23d32f81dadf9e7a6a47782c8010d8f67598544", default-features = false, features = ["rustls"] }
inaturalist-oauth = { git = "https://tangled.org/kueda.net/rust-inaturalist", rev = "c23d32f81dadf9e7a6a47782c8010d8f67598544" }
# Deterministic IDs for cross-posted records
uuid = { version = "1", features = ["v5"] }
url = { workspace = true }

# Async trait support (needed for Store implementations)
async-trait = "0.1"

# URL encoding
urlencoding = { workspace = true }

# Async combinators
futures = { workspace = true }

# In-memory cache for taxonomy lookups
moka = { workspace = true }

[dev-dependencies]
# HTTP mock server for testing the GBIF cache layer without
# hitting the live GBIF API.
wiremock = "0.6"
# Paused time, for testing the iNaturalist rate limiter
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "observing-appview"
path = "src/main.rs"
