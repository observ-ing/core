[package]
name = "gcp-cloud-tasks"
version = "0.1.0"
edition = "2021"
description = "Minimal Cloud Tasks client: create HTTP tasks from a Cloud Run service"
license = "MIT OR Apache-2.0"

[dependencies]
# REST calls to Cloud Tasks and the metadata server
reqwest = { workspace = true }

# Request and response bodies
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"

# `scheduleTime`, and when a cached access token runs out
chrono = { workspace = true }

# Guards the cached access token
tokio = { workspace = true }
