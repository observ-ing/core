[advisories]
ignore = [
# jacquard-common -> postcard -> heapless 0.7 -> atomic-polyfill (no postcard release with heapless 0.8 yet)
    { id = "RUSTSEC-2023-0089", reason = "unmaintained, transitive dep via postcard" },
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, build-time transitive dep via gbif -> progenitor -> serde_yaml" },
# utoipa-swagger-ui -> zip 8 (build-time only). Its build script extracts the
# Swagger UI archive vendored in the crate, never an untrusted one, which is what
# these need. Remove once utoipa-swagger-ui allows zip 9 (juhaku/utoipa#1645).
    { id = "RUSTSEC-2026-0367", reason = "zip SUID/SGID extraction; build-time only, trusted vendored archive" },
    { id = "RUSTSEC-2026-0368", reason = "zip symlink extraction; build-time only, trusted vendored archive" },
    { id = "RUSTSEC-2026-0369", reason = "zip permissions through symlinks; build-time only, trusted vendored archive" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
