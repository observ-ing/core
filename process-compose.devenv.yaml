version: "0.5"

# Overlay for the ISOLATED dev-env e2e run (scripts/e2e-devenv.ts), layered on
# the normal stack:
#
#   process-compose -f process-compose.yaml -f process-compose.devenv.yaml up
#
# Only what differs from process-compose.yaml lives here. Everything
# run-specific (the dev-env PLC/PDS endpoints, a throwaway DATABASE_URL and
# TAP_DATABASE_URL, ports) is environment the orchestrator sets: process-compose
# passes its environment through to every process, and the base file's
# ${VAR:-default} entries pick it up.

processes:

  # The create/view flow doesn't need species-id (and its ~2.4 GB model).
  species-id:
    disabled: true

  appview:
    environment:
      # Empty → appview treats species-id as absent instead of calling the
      # disabled service.
      - SPECIES_ID_SERVICE_URL=
